<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed tile. Radius 112 of 512 (22%), the Windows 11 proportion. -->
  <rect width="512" height="512" rx="112" fill="url(#tileGrad)" />

  <!--
    Receipt: flat top, zig-zag torn bottom, one bar of negative space for a line of print.
    Sized to the 384x384 safe area rather than drawn small in the middle of the canvas — at 25%
    width the whole mark collapsed to a 4px sliver at 16px. Fill-only, no strokes, so nothing
    thins out as it scales down. Smallest feature is the 48-unit bar: 1.5px at 16px.
  -->
  <path d="M156,88 L356,88 L356,388 L331,424 L306,388 L281,424 L256,388 L231,424 L206,388 L181,424 L156,388 Z
           M186,152 L326,152 L326,200 L186,200 Z"
        fill="url(#receiptGrad)" fill-rule="evenodd" />
</svg>
