<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#hexGrad)" />
  <!-- Outer Hexagonal Accent Frame -->
  <polygon points="256,96 384,170 384,318 256,392 128,318 128,170"
           fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linejoin="round" />
  <!-- Center Minimal Monogram Node -->
  <circle cx="256" cy="244" r="32" fill="url(#accentGrad)" />
</svg>
